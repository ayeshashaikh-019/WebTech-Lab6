<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tech Lab 6 - Task 3</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Web Technology Lab 6</h1>
        <h2>Task 3: Day-Name Switch</h2>

        <label for="dayInput">Enter a day number (1-7):</label>

        <input
            type="number"
            id="dayInput"
            min="1"
            max="7"
            step="1"
            placeholder="Enter 1 to 7"
        >

        <button id="checkButton" type="button">
            Show Day
        </button>

        <p id="result"></p>
    </div>

</body>
</html>
