
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tech Lab 6 - Task 4</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Web Technology Lab 6</h1>
        <h2>Task 4: Grade Calculator</h2>

        <label for="scoreInput">Enter your score (0-100):</label>

        <input
            type="number"
            id="scoreInput"
            min="0"
            max="100"
            step="1"
            placeholder="Enter score"
        >

        <button id="calculateButton" type="button">
            Calculate Grade
        </button>

        <div id="gradeResult"></div>
    </div>

</body>
</html>
